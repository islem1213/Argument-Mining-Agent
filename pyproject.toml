[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argmine-agent"
version = "0.2.0"
description = "Hybrid argument mining: discourse heuristics, local NLI or LLM judges, and formal argumentation semantics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Islem Alimi" }]
keywords = ["argument mining", "nlp", "llm", "argumentation", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["pydantic>=2.0", "networkx>=3.0"]

[project.optional-dependencies]
llm = ["openai>=1.40"]
nli = ["transformers>=4.40", "torch>=2.0", "sentencepiece>=0.2"]
train = ["transformers>=4.40", "datasets>=2.18", "torch>=2.0", "accelerate>=0.30", "numpy"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = ["argmine-agent[llm,nli,mcp]"]

[project.urls]
Repository = "https://github.com/islem1213/Argument-Mining-Agent"

[project.scripts]
argmine = "argmine.cli:main"
argmine-mcp = "argmine.mcp_server:main"
argmine-eval = "argmine.evaluate:main"

[tool.setuptools.packages.find]
include = ["argmine*", "eval*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
