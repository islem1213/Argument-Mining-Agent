im (stance/marker)</title></path><path d="M403.0,368 C403.0,333.0 145.0,333.0 145.0,300" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-support)" class="edge" data-source="c4" data-target="c3"><title>c4 support c3 (0.50) — nearest claim</title></path><path d="M403.0,214 C403.0,179.0 145.0,179.0 145.0,146" fill="none" stroke="#dc2626" stroke-width="2.3" stroke-dasharray="6 4" marker-end="url(#arrow-attack)" class="edge" data-source="c5" data-target="c1"><title>c5 attack c1 (0.55) — claim → major claim (stance/marker)</title></path><path d="M661.0,368 C661.0,333.0 403.0,333.0 403.0,300" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-support)" class="edge" data-source="c6" data-target="c5"><title>c6 support c5 (0.50) — nearest claim</title></path><path d="M661.0,522 C661.0,487.0 661.0,487.0 661.0,454" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrow-attack)" class="edge" data-source="c7" data-target="c6"><title>c7 attack c6 (0.60) — contrast marker 'but'</title></path><path d="M919.0,368 C919.0,333.0 661.0,333.0 661.0,300" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-support)" class="edge" data-source="c8" data-target="c9"><title>c8 support c9 (0.65) — followed by conclusion marker 'therefore'</title></path><path d="M661.0,214 C661.0,179.0 145.0,179.0 145.0,146" fill="none" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-support)" class="edge" data-source="c9" data-target="c1"><title>c9 support c1 (0.55) — claim → major claim (stance/marker)</title></path><g class="node" data-id="c1" opacity="0.55"><title>Schools should start later in the morning.</title><rect x="30" y="60" width="230" height="84" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="40" y="77" font-size="10.5" font-weight="600" fill="#1e3a8a">c1 · major claim · pro</text><text x="40" y="95" font-size="11.5" fill="#111827">Schools should start later in the</text><text x="40" y="109" font-size="11.5" fill="#111827">morning.</text><rect x="40" y="135" width="210" height="3" rx="1.5" fill="#e5e7eb"/><rect x="40" y="135" width="141.1" height="3" rx="1.5" fill="#1d4ed8"/></g><g class="node" data-id="c2" opacity="1"><title>Teenagers need more sleep</title><rect x="30" y="368" width="230" height="84" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="40" y="385" font-size="10.5" font-weight="600" fill="#134e4a">c2 · premise · neutral</text><text x="40" y="403" font-size="11.5" fill="#111827">Teenagers need more sleep</text><rect x="40" y="443" width="210" height="3" rx="1.5" fill="#e5e7eb"/><rect x="40" y="443" width="105.0" height="3" rx="1.5" fill="#0f766e"/></g><g class="node" data-id="c3" opacity="1"><title>later starts improve learning.</title><rect x="30" y="214" width="230" height="84" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="40" y="231" font-size="10.5" font-weight="600" fill="#4c1d95">c3 · claim · pro</text><text x="40" y="249" font-size="11.5" fill="#111827">later starts improve learning.</text><rect x="40" y="289" width="210" height="3" rx="1.5" fill="#e5e7eb"/><rect x="40" y="289" width="183.8" height="3" rx="1.5" fill="#7c3aed"/></g><g class="node" data-id="c4" opacity="1"><title>A 2014 study found that students at later-starting schools had better grades and fewer absences.</title><rect x="288" y="368" width="230" height="84" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="298" y="385" font-size="10.5" font-weight="600" fill="#134e4a">c4 · premise · pro</text><text x="298" y="403" font-size="11.5" fill="#111827">A 2014 study found that students at</text><text x="298" y="417" font-size="11.5" fill="#111827">later-starting schools had better</text><text x="298" y="431" font-size="11.5" fill="#111827">grades and fewer absences.</text><rect x="298" y="443" width="210" height="3" rx="1.5" fill="#e5e7eb"/><rect x="298" y="443" width="105.0" height="3" rx="1.5" fill="#0f766e"/></g><g class="node" data-id="c5" opacity="1"><title>critics worry about transport costs.</title><rect x="288" y="214" width="230" height="84" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="298" y="231" font-size="10.5" font-weight="600" fill="#4c1d95">c5 · claim · con</text><text x="298" y="249" font-size="11.5" fill="#111827">critics worry about transport costs.</text><rect x="298" y="289" width="210" height="3" rx="1.5" fill="#e5e7eb"/><rect x="298" y="289" width="131.2" height="3" rx="1.5" fill="#7c3aed"/></g><g class="node" data-id="c6" opacity="0.55"><title>Buses would have to run on new schedules</title><rect x="546" y="368" width="230" height="84" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/><text x="556" y="385" font-size="10.5" font-weight="600" fill="#134e4a">c6 · premise · neutral</text><text x="556" y="403" font-size="11.5" fill="#111827">Buses would have to run on new</text><text x="556" y="417" font-size="11.5" fill="#111827">schedules</text><rect x="556" y="443" width="210" height="3" rx="1.5" fill="#e5e7eb"/><rect x="556" y="443" width="52.5" height="3" rx="1.5" fill="#0f766e"/></g><g class="node" data-id="c7" opacity="1"><title>many districts already share buses across schools.</title><rect x="546" y="522" width="230" height="84" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="556" y="539" font-size="10.5" font-weight="600" fill="#134e4a">c7 · premise · con</text><text x="556" y="557" font-size="11.5" fill="#111827">many districts already share buses</text><text x="556" y="571" font-size="11.5" fill="#111827">across schools.</text><rect x="556" y="597" width="210" height="3" rx="1.5" fill="#e5e7eb"/><rect x="556" y="597" width="105.0" height="3" rx="1.5" fill="#0f766e"/></g><g class="node" data-id="c8" opacity="1"><title>Everyone knows that early starts are terrible for families.</title><rect x="804" y="368" width="230" height="84" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="814" y="385" font-size="10.5" font-weight="600" fill="#134e4a">c8 · premise · neutral</text><text x="814" y="403" font-size="11.5" fill="#111827">Everyone knows that early starts are</text><text x="814" y="417" font-size="11.5" fill="#111827">terrible for families.</text><rect x="814" y="443" width="210" height="3" rx="1.5" fill="#e5e7eb"/><rect x="814" y="443" width="105.0" height="3" rx="1.5" fill="#0f766e"/></g><g class="node" data-id="c9" opacity="1"><title>the benefits of later start times clearly outweigh the costs.</title><rect x="546" y="214" width="230" height="84" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="556" y="231" font-size="10.5" font-weight="600" fill="#4c1d95">c9 · claim · pro</text><text x="556" y="249" font-size="11.5" fill="#111827">the benefits of later start times</text><text x="556" y="263" font-size="11.5" fill="#111827">clearly outweigh the costs.</text><rect x="556" y="289" width="210" height="3" rx="1.5" fill="#e5e7eb"/><rect x="556" y="289" width="157.5" height="3" rx="1.5" fill="#7c3aed"/></g></svg>