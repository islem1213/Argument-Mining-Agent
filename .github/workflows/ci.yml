name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,llm,mcp]"
      - run: ruff check .
      - run: pytest -q
      - name: Smoke-test the CLI
        run: argmine --file examples/school_start_times.txt --html report.html --image map.svg --mermaid map.mmd
